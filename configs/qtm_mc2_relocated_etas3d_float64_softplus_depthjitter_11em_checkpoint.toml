# QTM M >= 2.0 relocated ETAS3D experiment with softplus depth parameters
# and deterministic 50 m jitter for exactly repeated catalog depths.

[runtime]
device = "cuda:0"
dtype = "float64"

[catalog]
path = "../data/qtm_final_9.5dev_mc2.0_relocated.csv"
columns_preset = "geographic_earthquake"
event_id_column = "event_id"
completeness_magnitude = 2.0
time_unit = "day"
distance_unit = "degree"
coordinate_system = "EPSG:4326"
depth_unit = "km"
depth_positive = "down"

[catalog.duplicates]
time_policy = "jitter"
position_policy = "jitter"
position_minimum_separation_m = 50.0
depth_policy = "jitter"
depth_minimum_separation = 0.05 # km (50 m), matching horizontal jitter scale
warn = true

[catalog.depth_filter]
minimum = 0.0
maximum = 50.0
include_minimum = true
include_maximum = false

[projection]
method = "legacy_local_approx"
source_crs = "EPSG:4326"

[domain]
time_zero = 0.0
time_start = 0.0
time_end = 3653.0
include_start = true
include_end = true
bbox = [-121.953, 31.86317, -114.026, 37.22333]

[model]
type = "etas3d"
maximum_depth = 50.0
depth_boundary_offset = 0.5

[model.integration]
type = "polygon"
subdivisions = 1001
source_chunk_size = 4000

[model.parameters.mu]
value = 0.068136

[model.parameters.amplitude]
value = 0.38721

[model.parameters.c]
value = 0.15163

[model.parameters.alpha]
value = 1.2628

[model.parameters.p]
value = 1.2941

[model.parameters.d]
value = 0.00011933

[model.parameters.q]
value = 1.9169

[model.parameters.gamma]
value = 0.47143

[model.parameters.eta]
value = 201.39
transform = "softplus"

[model.parameters.delta]
value = 0.50050
transform = "softplus"

[background]
depth_concentration = 100.0
target_chunk_size = 2000
source_chunk_size = 4000

[background.bandwidth]
method = "knn"
neighbors = 3
minimum = 0.02
target_chunk_size = 2000
source_chunk_size = 4000

[background.state]
initial_probability = 1.0
duration = "observation"

[background.integration]
type = "polygon"
subdivisions = 1001
source_chunk_size = 4000

[likelihood]
type = "exact"
target_chunk_size = 2000
source_chunk_size = 4000
checkpoint_blocks = true

[inference]
type = "fortran_em_lbfgs"

[inference.em]
outer_iterations = 11
e_steps_per_outer = 11
decrease_e_steps = true

[inference.lbfgs]
lr = 0.05
max_iter = 20
history_size = 10
line_search = "strong_wolfe"

[inference.convergence]
background_tolerance = 1e-7
parameter_tolerance = 1e-7

[inference.monitor]
print_parameters = true
stop_on_degenerate = true
boundary_tolerance = 1e-10
maximum_absolute_value = 1e6

[output]
enabled = true
directory = "../output/qtm_mc2_relocated_etas3d_float64_softplus_depthjitter_11em_checkpoint_run"

[relations]
enabled = true
directory = "relations"
probability_threshold = 1e-4
target_chunk_size = 2000
source_chunk_size = 4000
